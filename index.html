<script>
window.__errs = [];
window.addEventListener("error", function (ev) {
  try {
    var t = ev.target;
    if (t && t !== window && (t.src || t.href)) { window.__errs.push("লোড হয়নি: " + (t.src || t.href)); return; }
    window.__errs.push((ev.message || "?") + (ev.filename ? " [" + String(ev.filename).split("/").pop() + ":" + (ev.lineno || "?") + "]" : ""));
  } catch (e) {}
}, true);
window.addEventListener("unhandledrejection", function (ev) {
  try { window.__errs.push("প্রতিশ্রুতি: " + String((ev.reason && ev.reason.message) || ev.reason)); } catch (e) {}
});
</script>
<link rel="stylesheet" href="lib/maplibre-gl.css" onerror="this.onerror=null;this.href='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css'">
<style>

  @keyframes p { 70% { box-shadow: 0 0 0 16px rgba(180,21,90,0); } 100% { box-shadow: 0 0 0 0 rgba(180,21,90,0); } }
  #err { display: none; position: absolute; top: calc(var(--mb) + 120px); left: 10px; right: 70px; z-index: 30; background: #b71c1c; color: #fff; border-radius: 12px; padding: 10px 12px; font-size: 13px; word-break: break-word; }

  .menubar { position: absolute; top: 0; left: 0; right: 0; height: var(--mb); z-index: 20; background: #0b5d3b; color: #fff;
    display: flex; align-items: center; gap: 10px; padding: 0 8px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .menu-btn { width: 42px; height: 42px; border: 0; border-radius: 10px; background: transparent; color: #fff; font-size: 26px; line-height: 1; cursor: pointer; }
  .menu-btn:active { background: rgba(255,255,255,.18); }
  .menu-title { font-size: 18px; font-weight: 700; letter-spacing: .2px; }

  .drawer-backdrop { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s; }

  .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 80vw; max-width: 300px; z-index: 50; background: #fff; transform: translateX(-104%);

  .modal-title { font-size: 19px; font-weight: 700; color: #0b5d3b; margin-bottom: 10px; }
  .modal-body { font-size: 15.5px; line-height: 1.65; color: #333; white-space: pre-line; max-height: 58vh; overflow-y: auto; word-break: break-word; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .mbtn { padding: 10px 18px; border: 0; border-radius: 12px; background: #eef1ef; color: #333; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .mbtn.primary { background: #0b5d3b; color: #fff; }
</style>

<script>if (window.maplibregl) { window.__srcML = "লোকাল ফাইল"; } else { window.__srcML = "ইন্টারনেট"; document.write('<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"><\/script>'); }</script>

<script>
function showErr(m) { const e = document.getElementById("err"); if (e) { e.style.display = "block"; e.textContent = "⚠️ ত্রুটি: " + m; } }
window.addEventListener("error", ev => {
  // বিবরণ-লুকানো "Script error." আসে অ্যাপ/এক্সটেনশন থেকে ঢোকানো বা বাইরের স্ক্রিপ্ট থেকে, আমাদের কোডের নয়: ব্যানার না দেখিয়ে কনসোলে রাখি
  if (/libs-missing/.test(ev.message || "")) return;
  if (!ev.filename && !ev.lineno && /^Script error\.?$/i.test(ev.message || "")) { try { console.warn("Script error (বিবরণ নেই)"); } catch (e) {} return; }
  const where = ev.filename ? " [" + String(ev.filename).split("/").pop() + ":" + (ev.lineno || "?") + "]" : "";
  showErr((ev.message || "অজানা ত্রুটি") + where);
});
window.addEventListener("unhandledrejection", ev => showErr(String(ev.reason && ev.reason.message || ev.reason)));

// ====UI-BEGIN====
// ---------- Train Locator: মডাল ও সাইড মেনু ----------
const APP_NAME = "Train Locator";
const APP_VERSION = "১.০";
// লোগো: এখানে Cloudinary-র ছবির লিংক বসান (খালি থাকলে বা লিংক কাজ না করলে ছোট ট্রেনের আইকন দেখাবে)
const LOGO_URL = "";

const RULES_TEXT = `এই অ্যাপটি লোকেশন ভিত্তিক। তাই আপনি যদি ট্রেনে ভ্রমণ করেন, তাহলে "আমি এই ট্রেনে আছি" বাটনে ক্লিক করে আপনার ফোনের জিপিএস অন করার অনুমতি প্রদান করবেন। এতে উক্ত ট্রেনের লোকেশন, আপনার মোবাইলে থাকা জিপিএসের সাথে কানেক্ট হয়ে সঠিক অবস্থান দেখাবে। এছাড়া অন্য কেউ লোকেশন শেয়ার করলেও বাকি সবাই ট্রেনের লোকেশন দেখতে পাবে।

আশা করি বাসায় বসে কেউ লোকেশন শেয়ার করবেন না। এতে করে সবার কাছে যেকোনো ট্রেনের ভুল লোকেশন চলে আসতে পারে।

ধন্যবাদ।`;
const MAKER_TEXT = `মুহাম্মদ রশিদুল আলম
স্টেশন মাস্টার গ্রেড-৩
বাংলাদেশ রেলওয়ে, চট্টগ্রাম।`;

const byId = id => document.getElementById(id);

// মডাল: সবসময় সারিতে একটার পর একটা দেখায়; Promise ফেরত দেয় (বোতামের value দিয়ে)
let modalChain = Promise.resolve();
function showModal(opts) {
  const run = () => new Promise(resolve => {
    const root = byId("modal"), actEl = byId("modalActions");
    byId("modalTitle").textContent = opts.title || APP_NAME;
    byId("modalBody").textContent = opts.message || "";
    actEl.textContent = "";
    let done = false, primaryBtn = null;
    const onKey = e => { if (e.key === "Escape") { e.preventDefault(); finish(opts.cancelValue); } };
    const finish = v => {
      if (done) return; done = true;
      try { if (document.activeElement && root.contains(document.activeElement)) document.activeElement.blur(); } catch (e) {}
      root.classList.remove("open"); root.setAttribute("aria-hidden", "true");
      document.removeEventListener("keydown", onKey, true);
      resolve(v);
    };
    (opts.buttons || [{ label: "ঠিক আছে", value: true, primary: true }]).forEach(b => {
      const btn = document.createElement("button");
      btn.type = "button"; btn.textContent = b.label; btn.className = "mbtn" + (b.primary ? " primary" : "");
      btn.addEventListener("click", () => finish(b.value));
      actEl.appendChild(btn);
      if (b.primary) primaryBtn = btn;
    });
    root.onclick = e => { if (e.target === root) finish(opts.cancelValue); };
    document.addEventListener("keydown", onKey, true);
    root.classList.add("open"); root.setAttribute("aria-hidden", "false");
    if (primaryBtn) setTimeout(() => { try { primaryBtn.focus(); } catch (e) {} }, 30);
  });
  modalChain = modalChain.then(run, run);
  return modalChain;
}
const uiAlert = (msg, title) => showModal({ title, message: msg, buttons: [{ label: "ঠিক আছে", value: true, primary: true }], cancelValue: true });
const uiConfirm = (msg, title) => showModal({ title, message: msg, buttons: [{ label: "বাতিল", value: false }, { label: "ঠিক আছে", value: true, primary: true }], cancelValue: false });

// সাইড মেনু
const drawerEl = byId("drawer"), drawerBackdrop = byId("drawerBackdrop");
function openDrawer() { drawerEl.classList.add("open"); drawerBackdrop.classList.add("open"); drawerEl.setAttribute("aria-hidden", "false"); }
function closeDrawer() { try { if (document.activeElement && drawerEl.contains(document.activeElement)) document.activeElement.blur(); } catch (e) {} drawerEl.classList.remove("open"); drawerBackdrop.classList.remove("open"); drawerEl.setAttribute("aria-hidden", "true"); }
byId("menuBtn").addEventListener("click", openDrawer);
drawerBackdrop.addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
byId("miRules").addEventListener("click", () => { closeDrawer(); uiAlert(RULES_TEXT, "নিয়মাবলি"); });
byId("miMaker").addEventListener("click", () => { closeDrawer(); uiAlert(MAKER_TEXT, "প্রস্তুতকারক"); });
byId("miVersion").addEventListener("click", async () => {
  closeDrawer();
  const r = await showModal({ title: "ভার্সন", message: APP_NAME + "\nভার্সন " + APP_VERSION,
    buttons: [{ label: "বিস্তারিত", value: "diag" }, { label: "রেল ডেটা সেভ", value: "save" }, { label: "ঠিক আছে", value: true, primary: true }], cancelValue: true });
  if (r === "diag") uiAlert(await diagText(), "সমস্যা-নির্ণয়");
  if (r === "save") saveRailFile();
});

// রেল ডেটা ফাইল হিসেবে নামানো (Chrome-এ লোড হলে rail.json বানিয়ে GitHub-এ রাখার জন্য)
function saveRailFile() {
  let s = window.__railJson;
  try { if (!s) s = localStorage.getItem(CACHE_KEY); } catch (e) {}
  if (!s) { uiAlert("রেল ডেটা এখনও লোড হয়নি। লোড হওয়ার পর আবার চেষ্টা করুন।"); return; }
  try { const j = JSON.parse(s); j.stationsRaw = dedupeStations(j.stationsRaw); s = JSON.stringify(j); } catch (e) {}
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([s], { type: "application/json" }));
    a.download = "rail.json"; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { uiAlert("ফাইল নামানো যায়নি: " + e.message); }
}

// সমস্যা-নির্ণয়: কোথায় আটকাচ্ছে বোঝার জন্য (WebView-এ অ্যাপের ভেতরে কাজ না করলে স্ক্রিনশট পাঠাতে)
async function diagText() {
  const L = [];
  const ua = navigator.userAgent || "";
  const cm = ua.match(/Chrome\/([\d.]+)/);
  L.push("ব্রাউজার: " + (cm ? "Chrome " + cm[1] : ua.slice(0, 60)) + (/; wv\)/.test(ua) ? " (WebView)" : ""));
  L.push("ঠিকানা: " + location.href);

// ===== রেল-রুট কোর: OSM ডেটা থেকে গ্রাফ বানিয়ে চট্টগ্রাম→কক্সবাজার সবচেয়ে ছোট পথ বের করা =====
function hav(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

function buildGraph(elements) {
  const map = new Map(), pts = [], adj = [];
  const nid = (id, lat, lon) => {
    let i = map.get(id);
    if (i === undefined) { i = pts.length; map.set(id, i); pts.push([lon, lat]); adj.push([]); }
    return i;
  };
  for (const el of elements) {
    if (el.type !== "way" || !el.geometry || !el.nodes) continue;
    let prev = null;
    for (let k = 0; k < el.nodes.length; k++) {
      const g = el.geometry[k];
      if (!g) { prev = null; continue; }
      const i = nid(el.nodes[k], g.lat, g.lon);
      if (prev !== null && prev !== i) {
        const w = hav(pts[prev], pts[i]);
        adj[prev].push([i, w]); adj[i].push([prev, w]);
      }
      prev = i;
    }
  }
  return { pts, adj };
}

function largestComponent(adj) {
  const n = adj.length, comp = new Int32Array(n).fill(-1);
  let best = -1, bestSize = 0, c = 0;
  for (let s = 0; s < n; s++) {
    if (comp[s] !== -1) continue;
    let size = 0; const stack = [s]; comp[s] = c;
    while (stack.length) {
      const u = stack.pop(); size++;
      for (const [v] of adj[u]) if (comp[v] === -1) { comp[v] = c; stack.push(v); }
    }
    if (size > bestSize) { bestSize = size; best = c; }
    c++;
  }
  return { comp, best };
}

function nearestNode(pts, comp, best, c) {
  let bi = -1, bd = Infinity;
  for (let i = 0; i < pts.length; i++) {
    if (comp[i] !== best) continue;
    const dx = (pts[i][0] - c[0]) * Math.cos(c[1] * Math.PI / 180), dy = pts[i][1] - c[1];
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; bi = i; }
  }
  return bi;
}

class MinHeap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(item) {
    const a = this.a; a.push(item); let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; }
  }
  pop() {
    const a = this.a, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last; let i = 0;
      for (;;) {
        let l = 2 * i + 1, r = l + 1, m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l;
        if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m;
      }
    }
    return top;
  }
}

function dijkstra(adj, s, t) {
  const n = adj.length, dist = new Float64Array(n).fill(Infinity), prev = new Int32Array(n).fill(-1);
  const h = new MinHeap(); dist[s] = 0; h.push([0, s]);
  while (h.size) {
    const [d, u] = h.pop();
    if (d > dist[u]) continue;
    if (u === t) break;
    for (const [v, w] of adj[u]) {
      const nd = d + w;
      if (nd < dist[v]) { dist[v] = nd; prev[v] = u; h.push([nd, v]); }
    }
  }
  if (!isFinite(dist[t])) return null;
  const path = []; for (let u = t; u !== -1; u = prev[u]) path.push(u);
  return path.reverse();
}

// elements = Overpass JSON এর elements; ফেরত: {coords, stationsRaw} বা null
// একই স্টেশনের একাধিক পিন (প্ল্যাটফর্ম/হল্ট/নামের ভিন্ন রূপ) একটিতে মেলানো: একই নাম বা ৪০০ মিটারের মধ্যে = একই
function dedupeStations(list) {
  const out = [];
  for (const s of list) {
    if (!s || !s.name) continue;
    const dup = out.find(o => o.name === s.name || (o.en && s.en && o.en.toLowerCase() === s.en.toLowerCase() && hav(o.c, s.c) < 3000) || hav(o.c, s.c) < 400);
    if (!dup) out.push(s);
  }
  return out;
}

function extractRoute(elements, startApprox, endApprox) {
  const stationsAll = elements
    .filter(e => (e.type === "node" || e.center) && e.tags && (/^(station|halt|stop)$/.test(e.tags.railway || "") || e.tags.public_transport === "station"))
    .map(e => ({ name: e.tags["name:bn"] || e.tags.name || "", en: e.tags["name:en"] || e.tags.name || "",
                 c: e.type === "node" ? [e.lon, e.lat] : [e.center.lon, e.center.lat] }))
    .filter(s => s.name);

  const pick = (re, approx) => {
    const m = stationsAll.filter(s => re.test(s.name) || re.test(s.en));
    if (!m.length) return approx;
    m.sort((a, b) => hav(a.c, approx) - hav(b.c, approx));
    return hav(m[0].c, approx) < 25000 ? m[0].c : approx;
  };
  let startC = pick(/চট্টগ্রাম|Chattogram|Chittagong/i, startApprox);
  let endC = pick(/কক্সবাজার|Cox/i, endApprox);
  try { startC = ROUTE_ORDER[0].c; endC = ROUTE_ORDER[ROUTE_ORDER.length - 1].c; } catch (e) {}   // যাচাই-করা স্টেশন থেকেই শুরু ও শেষ

  const { pts, adj } = buildGraph(elements);
  if (pts.length < 2) return null;
  const { comp, best } = largestComponent(adj);
  const s = nearestNode(pts, comp, best, startC), t = nearestNode(pts, comp, best, endC);
  if (s < 0 || t < 0 || s === t) return null;
  const path = dijkstra(adj, s, t);
  if (!path || path.length < 2) return null;
  return { coords: path.map(i => pts[i]), stationsRaw: dedupeStations(stationsAll) };
}

function makeIndex(coords) {
  const cum = [0];
  for (let i = 1; i < coords.length; i++) cum.push(cum[i - 1] + hav(coords[i - 1], coords[i]));
  const total = cum[cum.length - 1];
  function pointAt(d) {
    d = Math.max(0, Math.min(total, d));
    let lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= d) lo = m; else hi = m; }
    const seg = cum[hi] - cum[lo], t = seg > 0 ? (d - cum[lo]) / seg : 0;
    return [coords[lo][0] + (coords[hi][0] - coords[lo][0]) * t, coords[lo][1] + (coords[hi][1] - coords[lo][1]) * t];
  }
  return { cum, total, pointAt };
}

// রুট বরাবর স্টেশন সাজানো: শুধু লাইনের ৩০০ মিটারের মধ্যেরগুলো, দূরত্ব লাইনের ওপর সঠিকভাবে মাপা
function snapStations(coords, idx, raw) {
  const out = [];
  for (const s of raw) {
    const r = snapToRoute(coords, idx.cum, s.c, null, 0);
    if (r && r.off <= 800) out.push({ name: s.name, c: s.c, d: r.d });
  }
  out.sort((a, b) => a.d - b.d);
  const res = [];
  for (const s of out) {
    const last = res[res.length - 1];
    if (last && (last.name === s.name || s.d - last.d < 120)) continue;
    res.push(s);
  }
  return res;
}

// GPS বিন্দুকে রেললাইনের নিকটতম বিন্দুতে বসানো; ফেরত {d: শুরু থেকে দূরত্ব(মিটার), off: লাইন থেকে ব্যবধান(মিটার)}
// hintD দিলে শুধু তার ±win মিটারের মধ্যে খোঁজে (দ্রুত ও লাফ-মুক্ত)
function snapToRoute(coords, cum, p, hintD, win) {
  const cos = Math.cos(p[1] * Math.PI / 180), k = 111320;
  let best = null;
  for (let i = 0; i < coords.length - 1; i++) {
    if (hintD != null && (cum[i + 1] < hintD - win || cum[i] > hintD + win)) continue;
    const ax = (coords[i][0] - p[0]) * cos * k, ay = (coords[i][1] - p[1]) * k;
    const bx = (coords[i + 1][0] - p[0]) * cos * k, by = (coords[i + 1][1] - p[1]) * k;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    const t = L2 > 0 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / L2)) : 0;
    const off = Math.hypot(ax + t * dx, ay + t * dy);
    if (!best || off < best.off) best = { off, d: cum[i] + t * (cum[i + 1] - cum[i]) };
  }
  return best;
}

// শেষে ক্রম (চট্টগ্রাম→কক্সবাজার) ভাঙে এমন ভুল-অবস্থানের স্টেশন বাদ দেওয়া হয়।
function buildOrderedStations(coords, idx, raw, extra) {
  const cand = [], missing = [];
  ROUTE_ORDER.forEach((e, i) => {
    let best = null;
    if (e.c) {
      const r0 = snapToRoute(coords, idx.cum, e.c, null, 0);
      if (r0 && r0.off <= 2500) best = { c: e.c, d: r0.d, off: r0.off, src: "যাচাই-করা", w: 3 };
    }
    if (!best && e.n.length) {
      const keys = e.n.map(normName);
      raw.concat(extra || []).forEach(s => {
        const a = normName(s.name), b = normName(s.en);
        if (!keys.some(k => k && (a.indexOf(k) !== -1 || b.indexOf(k) !== -1))) return;
        const r = snapToRoute(coords, idx.cum, s.c, null, 0);
        if (r && r.off <= 2500 && (!best || r.off < best.off)) best = { c: s.c, d: r.d, off: r.off, src: "OSM", w: 2 };
      });
    }
    if (!best && e.fb) {
      const r1 = snapToRoute(coords, idx.cum, e.fb, null, 0);
      if (r1 && r1.off <= 1500) best = { c: e.fb, d: r1.d, off: r1.off, src: "ফাইল", w: 1 };
    }
    if (best) cand.push(Object.assign({ name: e.name, i: i }, best)); else missing.push(e.name);
  });
  // ক্রম অনুযায়ী দূরত্ব (d) বাড়তে থাকা সবচেয়ে নির্ভরযোগ্য উপসারি রাখা
  const n = cand.length, score = [], prev = [];
  for (let a = 0; a < n; a++) {
    score[a] = cand[a].w; prev[a] = -1;
    for (let b = 0; b < a; b++) if (cand[b].d < cand[a].d - 30 && score[b] + cand[a].w > score[a]) { score[a] = score[b] + cand[a].w; prev[a] = b; }
  }
  let end = -1; for (let a = 0; a < n; a++) if (end < 0 || score[a] > score[end]) end = a;
  const keep = {}; for (let a = end; a >= 0; a = prev[a]) keep[a] = true;
  const list = [];
  cand.forEach((c, a) => { if (keep[a]) list.push({ name: c.name, c: c.c, d: c.d, off: c.off, src: c.src }); else missing.push(c.name + " (ক্রম মেলেনি)"); });
  return { list: list, missing: missing };
}

const OVERPASS = [

const QUERY = '[out:json][timeout:60];' +
  'way["railway"="rail"]["service"!~"siding|yard|spur|crossover"](21.38,91.78,22.42,92.15);out geom;' +
  'nwr["railway"~"^(station|halt|stop)$"](21.38,91.78,22.42,92.15);out center;' +

const CACHE_KEY = "railcache_ctg_coxs_v4";

async function fetchOverpass() {
  for (const url of OVERPASS) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 45000);
      const res = await fetch(url, { method: "POST", signal: ctl.signal,
        headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: "data=" + encodeURIComponent(QUERY) });
      clearTimeout(timer);
      if (!res.ok) continue;
      const json = await res.json();
      if (json && json.elements && json.elements.length) return json.elements;
    } catch (e) { /* পরের সার্ভার */ }
  }
  return null;
}
async function getRail() {
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (cached && cached.coords && cached.coords.length > 50) return cached;
  } catch (e) {}
  try {   // সাইটে রাখা তৈরি ফাইল (rail.json): অ্যাপে সবচেয়ে নির্ভরযোগ্য
    const rr = await fetch("rail.json?v=3");
    if (rr.ok) { const j = await rr.json(); if (j && j.coords && j.coords.length > 50) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(j)); } catch (e) {} return j; } }
  } catch (e) {}
  const elements = await fetchOverpass();
  if (!elements) return null;
  const r = extractRoute(elements, START_APPROX, END_APPROX);
  if (!r) return null;
  const q = p => [Math.round(p[0] * 1e5) / 1e5, Math.round(p[1] * 1e5) / 1e5];
  const out = { coords: r.coords.map(q), stationsRaw: r.stationsRaw.map(s => ({ name: s.name, en: s.en, c: q(s.c) })) };
  window.__railJson = JSON.stringify(out);
  try { localStorage.setItem(CACHE_KEY, window.__railJson); } catch (e) {}
  return out;
}

  map.addLayer({ id: "trainline", type: "line", source: "trainline", paint: { "line-color": "#b4155a", "line-width": 5.5, "line-opacity": ["interpolate", ["linear"], ["zoom"], 14, 1, 15.5, 0] } });
  mapLoaded = true;
  addRouteLayers();
});

// রেললাইন ও স্টেশন ম্যাপে বসানো (ম্যাপ ও রুট দুটোই তৈরি হলে)
function addRouteLayers() {
  if (!mapLoaded || !route || routeLayersAdded) return;
  routeLayersAdded = true;
  map.addSource("route", { type: "geojson", data: route });
  map.addLayer({ id: "route-casing", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#ffffff", "line-width": 7, "line-opacity": ["interpolate", ["linear"], ["zoom"], 14, 0.9, 16, 0.1, 17, 0] } }, "train");
  map.addLayer({ id: "route-line", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#d81b6a", "line-width": 3.5, "line-opacity": ["interpolate", ["linear"], ["zoom"], 14, 1, 16, 0.25, 17, 0] } }, "train");

  // ---- বাস্তব মাপের রেল ট্র্যাক (বাঁধ, পাথর, স্লিপার, দুই পাত) ----
  // মিটারকে পিক্সেলে রূপান্তর: জুম বাড়লে প্রতি জুমে দ্বিগুণ (অক্ষাংশ ~২২°)
  const mpx = m => ["interpolate", ["exponential", 2], ["zoom"], 14, m * TS * 0.2258, 22, m * TS * 57.8];
  const fadeIn = ["interpolate", ["linear"], ["zoom"], 15.2, 0, 16.2, 1];
  const L = { "line-cap": "butt", "line-join": "round" };
  map.addLayer({ id: "trk-bank", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#6f9142", "line-width": mpx(10), "line-opacity": ["interpolate", ["linear"], ["zoom"], 15.2, 0, 16.2, 0.9] } }, "train");
  map.addLayer({ id: "trk-ballast", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#8f8a80", "line-width": mpx(4.8), "line-opacity": fadeIn } }, "train");
  map.addLayer({ id: "trk-sleepers", type: "line", source: "route", layout: L,
    paint: { "line-color": "#6e6354", "line-width": mpx(2.8), "line-dasharray": [0.09, 0.13],
             "line-opacity": ["interpolate", ["linear"], ["zoom"], 16.2, 0, 17.2, 1] } }, "train");
  [-0.75, 0.75].forEach((o, i) => map.addLayer({ id: "trk-rail" + i, type: "line", source: "route", layout: L,
    paint: { "line-color": "#d4d8dd", "line-width": mpx(0.2), "line-offset": mpx(o), "line-opacity": ["interpolate", ["linear"], ["zoom"], 16.2, 0, 17.2, 1] } }, "train"));
  stations.forEach(s => {
    const el = document.createElement("div");
    el.className = "st" + (btnLayer.dataset.sat ? "" : " osm");
    el.innerHTML = "<i></i><span></span>"; el.lastChild.textContent = s.name;
    s.el = el;
    new maplibregl.Marker({ element: el, anchor: "bottom" }).setLngLat(idx.pointAt(s.d)).addTo(map);
  });
}

// ---------- রেললাইন লোড (পেছনে চলে, অ্যাপ আটকায় না) ----------
$("noteTxt").textContent = "রেললাইনের ডেটা লোড হচ্ছে…";
(async () => {
  let rail = null;
  try { rail = await getRail(); } catch (e) {}
  if (!rail) { $("noteTxt").textContent = "রেললাইনের ডেটা আনা যায়নি; ট্রেন সরাসরি GPS অবস্থানে দেখানো হবে।"; return; }
  routeCoords = rail.coords.slice();
  try {   // রুটের দুই প্রান্ত যদি স্টেশন থেকে সরে থাকে, সোজা সংযোগ দিয়ে স্টেশন পর্যন্ত টানা
    const S0 = ROUTE_ORDER[0].c, E0 = ROUTE_ORDER[ROUTE_ORDER.length - 1].c;
    const gs = hav(S0, routeCoords[0]), ge = hav(E0, routeCoords[routeCoords.length - 1]);
    if (gs > 20 && gs < 4000) routeCoords.unshift(S0);
    if (ge > 20 && ge < 4000) routeCoords.push(E0);
  } catch (e) {}
  idx = makeIndex(routeCoords); total = idx.total;
  route = turf.lineString(routeCoords);
  const rawAll = dedupeStations(rail.stationsRaw);
  EXTRA_STATIONS.forEach(x => { if (!rawAll.some(s => s.name === x.name)) rawAll.push(x); });
  const ord = buildOrderedStations(routeCoords, idx, rawAll, EXTRA_STATIONS);
  window.__stationMissing = ord.missing;
  window.__stationDiag = ord.list.map(s => s.name + " [" + s.src + " " + Math.round(s.off) + "মি]");
  stations = ord.list.length >= 8 ? ord.list : snapStations(routeCoords, idx, rawAll);
  allStations = rawAll.filter(s => s.name);
  $("noteTxt").textContent = "রুট ও স্টেশন: OpenStreetMap";
  addRouteLayers();
  if (lastLoc) onLocation(lastLoc, lastNow, true); // আগে আসা অবস্থান নতুন রুটে বসাই
})();

// ---------- ট্রেনের তালিকা ----------
const select = $("trainSelect");
async function loadTrains() {
  try {
    const res = await fetch(API_URL + "?action=trains");
    const data = await res.json();
    data.trains.forEach(t => { trains[t.id] = t; select.add(new Option(t.name + (t.route ? " (" + t.route + ")" : ""), t.id)); });
  } catch (e) { $("status").textContent = "ট্রেনের তালিকা লোড হয়নি। API_URL ঠিক আছে কিনা দেখুন।"; }
}

// ---------- নতুন অবস্থান পেলে ----------
function onLocation(loc, nowSrv, force) {
  lastLoc = loc; lastNow = nowSrv;
  const ageMs = Math.max(0, nowSrv - loc.time);
  live = { has: true, ageMs, recv: performance.now(), n: loc.n || 1 };
  if (!force && fix && fix.serverTime === loc.time) return;   // নতুন কিছু আসেনি

  const ll = [Number(loc.lng), Number(loc.lat)];
  if (!isFinite(ll[0]) || !isFinite(ll[1])) return;

  // রেললাইনে বসানো (দূরে হলে d = null → সরাসরি GPS মোড)
  let d = null;
  if (routeCoords) {
    let s = (fix && fix.d != null) ? snapToRoute(routeCoords, idx.cum, ll, fix.d, 6000) : null;
    if (!s || s.off > OFF_ROUTE) s = snapToRoute(routeCoords, idx.cum, ll, null, 0);
    if (s && s.off <= OFF_ROUTE) d = s.d;
  }

  // গতি অনুমান (দুই তথ্যের মাঝের পার্থক্য থেকে; মসৃণ করা)
  let v = 0, vx = 0, vy = 0;
  if (fix && !force && loc.time > fix.serverTime) {
    const dt = (loc.time - fix.serverTime) / 1000;
    if (dt >= 2 && dt <= 120) {
      if (d != null && fix.d != null) {
        const step = d - fix.d;
        v = Math.abs(step) < 8 ? 0 : clamp(step / dt, -45, 45);
        v = 0.6 * v + 0.4 * fix.v;
      } else if (d == null && fix.d == null) {
        const m = hav(fix.ll, ll);
        if (m >= 8 && m / dt <= 45) { vx = (ll[0] - fix.ll[0]) / dt; vy = (ll[1] - fix.ll[1]) / dt; v = m / dt; }
        vx = 0.6 * vx + 0.4 * fix.vx; vy = 0.6 * vy + 0.4 * fix.vy;
        v = 0.6 * v + 0.4 * fix.v;
      }
    }
  }
  fix = { serverTime: loc.time, tLocal: performance.now() - ageMs, ll, d, v, vx, vy, gps: Number(loc.speed) || 0 };
  if (d != null) { // দিক: জিপিএসের সামান্য নড়াচড়ায় বদলাবে না; স্পষ্ট এগোলেই নিশ্চিত হবে
    dirScore = 0.7 * dirScore + 0.3 * v;
    if (Math.abs(dirScore) > 1.5) { dirSign = dirScore > 0 ? 1 : -1; dirState = "measured"; }
  }

  if (!head) { // প্রথম অবস্থান: সোজা সেখানে
    head = { ll, d, heading: undefined };
    if (mode === "2d") map.flyTo({ center: ll, zoom: 12, duration: 1800 });
  }
}

// ---------- প্রতি ফ্রেমে মসৃণভাবে এগোনো ----------
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  try { step(now, dt); } catch (e) { showErr(e.message); }
  updateCard(now);
  requestAnimationFrame(tick);
}

function step(now, dt) {
  if (!fix || !head || !mapLoaded) return;
  const age = Math.min(EXTRAP_MAX, (now - fix.tLocal) / 1000);
  const k = 1 - Math.exp(-dt / 0.8);

  if (fix.d != null) {                                  // রেললাইন মোড
    const tgt = clamp(fix.d + fix.v * age, 0, total);
    if (head.d == null || Math.abs(tgt - head.d) > 3000) head.d = tgt; else head.d += (tgt - head.d) * k;
    head.ll = pointAt(head.d);
    const tb = bearingAt(head.d) + (dirSign < 0 ? 180 : 0);
    head.heading = head.heading === undefined ? tb : lerpAngle(head.heading, tb, 1 - Math.exp(-dt / 0.5));
  } else {                                              // সরাসরি GPS মোড
    const tgt = [fix.ll[0] + fix.vx * age, fix.ll[1] + fix.vy * age];
    if (head.d != null || hav(head.ll, tgt) > 3000) { head.ll = tgt; head.d = null; }
    else head.ll = [head.ll[0] + (tgt[0] - head.ll[0]) * k, head.ll[1] + (tgt[1] - head.ll[1]) * k];
    if (fix.v > 1) {
      const tb = turf.bearing(fix.ll, [fix.ll[0] + fix.vx, fix.ll[1] + fix.vy]);
      head.heading = head.heading === undefined ? tb : lerpAngle(head.heading, tb, 1 - Math.exp(-dt / 0.8));
    } else if (head.heading === undefined) head.heading = 0;
  }

  if (!window.__lastTrainSet || now - window.__lastTrainSet >= 33) {   // ৩০ বার/সেকেন্ড যথেষ্ট; ফোনের চাপ কমে
    window.__lastTrainSet = now;
    map.getSource("train").setData(trainFeatures());
    map.getSource("trainline").setData(trainLine());
  }
  if (!pulseAdded) { pulseMarker.setLngLat(head.ll).addTo(map); pulseAdded = true; } else pulseMarker.setLngLat(head.ll);
  pulseEl.style.display = map.getZoom() < 15.5 ? "flex" : "none";

  if (mode === "3d" && following && !flying) {
    if (!manualBearing) camBearing = lerpAngle(camBearing, head.heading + CAM_OFFSET, 0.04);
    // ক্যামেরা শুধু ট্রেনের সাথে সরে; জুম/কোণ ব্যবহারকারীর ঠিক করা মান থাকে
    let c = head.ll; try { c = back(CAM_BACK_M).ll; } catch (e) {}   // ইঞ্জিনের একটু পেছনে ক্যামেরার কেন্দ্র: ইঞ্জিন ও কোচ দুটোই দেখা যায়
    const L = lastCam;
    if (!L.c || Math.abs(L.c[0] - c[0]) > 1e-8 || Math.abs(L.c[1] - c[1]) > 1e-8 || Math.abs(L.b - camBearing) > 0.02 || L.z !== userZoom || L.p !== userPitch) {
      lastCam = { c: c.slice(), b: camBearing, z: userZoom, p: userPitch };
      map.jumpTo({ center: c, bearing: camBearing, pitch: userPitch, zoom: userZoom, padding: { top: 0, bottom: 150, left: 0, right: 0 } });
    }
  }
}

function updateCard(now) {
  // লাইভ ব্যাজ
  const badge = $("liveBadge");
  if (!selId) { badge.className = "badge"; badge.textContent = "ট্রেন সিলেক্ট করুন"; }
  else if (!live.has) { badge.className = "badge"; badge.textContent = "এই ট্রেনের লোকেশন কেউ শেয়ার করেননি"; }
  else {
    const ageS = (live.ageMs + (now - live.recv)) / 1000;
    const stale = ageS * 1000 > STALE_MS;
    badge.className = "badge " + (stale ? "stale" : "live");
    badge.textContent = (stale ? "⚠️ পুরনো তথ্য · " : "● লাইভ · ") + fmtAge(ageS) + " আগে" + (live.n > 1 ? " · " + bn(live.n) + " জনের তথ্য" : "");
  }
  // গতি
  if (fix) {
    let kmh = Math.abs(fix.v) * 3.6;
    if (kmh < 1 && fix.gps > 0.5) kmh = fix.gps * 3.6;
    $("spd").textContent = bn(Math.round(kmh));
  } else $("spd").textContent = bn(0);

  // বর্তমান স্থান (কার্ডের ওপরের লাইন)
  if (now - lastWhere > 400) {
    lastWhere = now;
    const w = whereLabel();
    setText("where", w); $("where").style.display = w ? "block" : "none";
  }

  const onRoute = head && head.d != null && stations.length >= 2;
  $("barWrap").style.display = "none";
  if (!onRoute) { setText("nextName", "—"); setText("nextDist", head ? "রেললাইনের বাইরে" : ""); return; }
  if (dirState === "unknown") { setText("nextName", "—"); setText("nextDist", "ট্রেন চলতে শুরু করলে দিক বোঝা যাবে"); return; }

  const d = head.d, n = stations.length;
  let cur = -1, bd = Infinity;
  stations.forEach((s, i) => { const x = Math.abs(s.d - d); if (x < bd) { bd = x; cur = i; } });
  let ni, pi;
  if (bd <= 150) { ni = cur + dirSign; pi = cur; }                       // কোনো স্টেশনে থাকলে পরেরটাই "পরবর্তী"
  else { const hi = firstAfter(d); ni = dirSign >= 0 ? hi : hi - 1; pi = ni - dirSign; }
  if (ni < 0 || ni >= n) { setText("nextName", "—"); setText("nextDist", "(এটি শেষ স্টেশন)"); return; }
  const next = stations[ni], prev = stations[clamp(pi, 0, n - 1)];
  const remain = Math.abs(next.d - d);
  setText("nextName", next.name);
  setText("nextDist", "(" + fmtDist(remain) + ")");
  setText("prevName", prev.name); setText("nextName2", next.name);
  // যাত্রাপথের পুরো দাগ: বাঁয়ে শুরুর স্টেশন, ডানে গন্তব্য (দিক অনুযায়ী); ট্রেন সেই দাগে এগোয়
  const sName = s => /^চট্টগ্রাম/.test(s.name) ? "চট্টগ্রাম" : s.name;
  const S = dirSign >= 0 ? stations[0] : stations[n - 1], E = dirSign >= 0 ? stations[n - 1] : stations[0];
  const span = Math.max(1, Math.abs(E.d - S.d));
  const frac = clamp(Math.abs(d - S.d) / span, 0, 1);
  setText("prevName", "শুরু: " + sName(S)); setText("nextName2", "গন্তব্য: " + sName(E));
  const tkKey = dirSign + ":" + n + ":" + Math.round(total);
  if (tkKey !== window.__tkKey) {   // স্টেশনের ছোট চিহ্ন (দিক বদলালে আবার)
    window.__tkKey = tkKey;
    $("ticks").innerHTML = stations.map(s => '<i class="tk" style="left:' + (Math.abs(s.d - S.d) / span * 100).toFixed(2) + '%"></i>').join("");
  }
  $("fill").style.width = (frac * 100) + "%"; $("dot").style.left = (frac * 100) + "%";
  const lbl = $("dotLbl");   // ট্রেন কোনো স্টেশনে (৮০০ মিটারের মধ্যে) থাকলে সেই নাম বিন্দুর ওপরে
  if (bd <= 800) { setText("dotLbl", stations[cur].name); lbl.style.display = "block"; lbl.style.left = clamp(frac * 100, 12, 88) + "%"; }
  else lbl.style.display = "none";
  $("barWrap").style.display = "block";
}
let lastWhere = 0;

// d-এর পরের প্রথম স্টেশনের সূচক (না থাকলে তালিকার দৈর্ঘ্য)
function firstAfter(d) { const i = stations.findIndex(s => s.d > d); return i === -1 ? stations.length : i; }

// "এখন কোথায়": স্টেশনে / কাছে / মাঝে, সাথে এলাকার নাম; লাইনের বাইরে হলে সবচেয়ে কাছের স্টেশন
function whereLabel() {
  if (!head) return "";
  const place = (geo.ll && geo.text && hav(geo.ll, head.ll) < 1500) ? geo.text : "";
  let main = "";
  if (head.d != null && stations.length >= 2) {
    const d = head.d;
    let cur = -1, bd = Infinity;
    stations.forEach((s, i) => { const x = Math.abs(s.d - d); if (x < bd) { bd = x; cur = i; } });
    const hi = firstAfter(d), lo = hi - 1;
    if (bd <= 150) main = stations[cur].name + " স্টেশনে";
    else if (bd <= 800 || lo < 0 || hi >= stations.length) main = stations[cur].name + " স্টেশনের কাছে";
    else main = stations[lo].name + " ও " + stations[hi].name + "-এর মাঝে";
  } else if (allStations.length) {
    let best = null, bd = Infinity;
    allStations.forEach(s => { const x = hav(s.c, head.ll); if (x < bd) { bd = x; best = s; } });
    if (best) main = "সবচেয়ে কাছের স্টেশন: " + best.name + " (" + fmtDist(bd) + ")";
  }
  return [place, main].filter(Boolean).join(" • ");
}

// এলাকার নাম: OpenStreetMap-এর Nominatim থেকে (বাংলায়), কম ঘনঘন
function placeFromAddress(a) {
  const place = a.neighbourhood || a.suburb || a.village || a.hamlet || a.town || a.city_district || a.city || "";
  const admin = a.county || a.state_district || "";
  return [place, admin].filter((x, i, arr) => x && arr.indexOf(x) === i).join(", ");
}
async function geocode(ll) {
  const now = Date.now();
  if (geo.busy || now - geo.t < 15000) return;
  if (geo.ll && hav(geo.ll, ll) < 400 && now - geo.t < 120000) return;
  geo.busy = true; geo.t = now;
  try {
    const res = await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&addressdetails=1&accept-language=bn,en" +
      "&lat=" + ll[1].toFixed(5) + "&lon=" + ll[0].toFixed(5));
    const j = await res.json();
    const txt = placeFromAddress((j && j.address) || {});
    if (txt) { geo.text = txt; geo.ll = ll; }
  } catch (e) { /* নেটওয়ার্ক সমস্যা: পরের বার আবার */ }
  finally { geo.busy = false; }
}
function geoTick() { if (selId && head) geocode(head.ll); }

// ট্রেনের রুট লেখা ("CXB - CTG", "কক্সবাজার–চট্টগ্রাম", "Cox's Bazar to Chattogram") থেকে চলার দিক বের করা।
// লেখাটি "শুরু - গন্তব্য" ধরা হয়। +১ = কক্সবাজারের দিকে, −১ = চট্টগ্রামের দিকে, ০ = বোঝা যায়নি
const CTG_RE = /CTG|CGP|Chattogram|Chittagong|চট্টগ্রাম|চিটাগাং|চিটাগং/i;
const CXB_RE = /CXB|Cox|কক্সবাজার|কক্স\s?বাজার/i;
function routeEnds(txt, wholeField) {
  const s = String(txt == null ? "" : txt).trim();
  if (!s) return null;
  if (wholeField) {   // শুধু রুটের ঘর: পুরোটাই "শুরু - গন্তব্য"
    const p = s.split(/\s*(?:–|—|-|→|>|\bto\b)\s*/i).filter(Boolean);
    return p.length >= 2 ? [p[0], p[p.length - 1]] : null;
  }
  // নামের ঘর ("৮১৫ কক্সবাজার এক্সপ্রেস CXB - CTG"): শেষ "কিছু - কিছু" অংশটি নিই
  const re = /([^\s\-–—→>]+)\s*[-–—→>]\s*([^\s\-–—→>]+)/g;
  let m, last = null;
  while ((m = re.exec(s)) !== null) last = m;
  return last ? [last[1], last[2]] : null;
}
function dirFromEnds(e) {
  if (!e) return 0;
  const o = e[0], d = e[1];
  let score = 0;
  if (CXB_RE.test(d)) score++;
  if (CTG_RE.test(o)) score++;
  if (CTG_RE.test(d)) score--;
  if (CXB_RE.test(o)) score--;
  return Math.sign(score);
}
function applyDirHint() {
  dirSign = 1; dirState = "unknown"; dirScore = 0;
  const tr = trains[selId];
  if (!tr) return;
  const s = dirFromEnds(routeEnds(tr.route, true)) || dirFromEnds(routeEnds(tr.name, false));
  if (s) { dirSign = s; dirState = "hint"; }
}

// ---------- সার্ভার থেকে লোকেশন আনা ----------
// নেট অবস্থা: ডেটা আনা বা পাঠানো ব্যর্থ হলে true; তখন শেয়ারকারীর পর্দায় ট্রেন নিজের GPS দিয়ে চলে
let pollFailing = false, sendFailing = false, srvSkew = 0;
async function poll() {
  if (!selId || pollBusy) return;
  pollBusy = true;
  const myId = selId;
  try {
    const res = await fetch(API_URL + "?action=locations&_=" + Date.now());
    const data = await res.json();
    pollFailing = false; if (data && data.now) srvSkew = data.now - Date.now();
    if (myId !== selId) return;
    const loc = data.locations && data.locations[myId];
    if (loc) { onLocation(loc, data.now, false); $("status").textContent = "✅ লোকেশন পাওয়া গেছে"; }
    else { live.has = false; $("status").textContent = "এই ট্রেনের লোকেশন এখনও কেউ শেয়ার করেননি।"; }
  } catch (e) { pollFailing = true; $("status").textContent = "ডেটা আনতে সমস্যা হয়েছে (ইন্টারনেট?)।"; }
  finally { pollBusy = false; }
}

// ---------- "আমি এই ট্রেনে আছি" ----------
const shareBtn = $("shareBtn");
const SHOW_MY_DOT = false;   // true করলে শেয়ার চালুর সময় নিজের অবস্থানে নীল বিন্দু দেখাবে
let watchId = null, lastSent = 0, myMarker = null;

async function sendLocation(pos) {
  const now = Date.now();
  if (now - lastSent < SEND_MS) return;
  lastSent = now;
  const ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 8000) : null;
  try {
    await fetch(API_URL, { method: "POST", mode: "no-cors", signal: ctl ? ctl.signal : undefined, headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ trainId: select.value, lat: pos.coords.latitude, lng: pos.coords.longitude, speed: pos.coords.speed || 0 }) });
    sendFailing = false;
    $("myStatus").textContent = "📡 পাঠানো হয়েছে (" + new Date().toLocaleTimeString("bn-BD") + ")";
  } catch (e) {
    sendFailing = true; lastSent = 0;   // নেট ফিরলে পরের GPS অবস্থানেই সঙ্গে সঙ্গে আবার পাঠাবে
    $("myStatus").textContent = "⚠️ ইন্টারনেট নেই, অবস্থান পাঠানো যাচ্ছে না। ট্রেন আপনার GPS-এ চলবে; নেট ফিরলে নিজে পাঠাবে।";
  } finally { if (timer) clearTimeout(timer); }
}

// ---------- অ্যাপ (App Inventor LocationSensor) থেকে লোকেশন ----------
// অ্যাপ ঘনঘন window.nativeLocation(lat, lng, speed, accuracy) ডাকবে; speed মিটার/সেকেন্ড
let nativeFix = null, nativeMode = false;
window.nativeLocation = function (lat, lng, speed, acc) {
  lat = Number(lat); lng = Number(lng);
  if (isNaN(lat) || isNaN(lng) || (lat === 0 && lng === 0)) return;
  nativeFix = { t: Date.now(), coords: { latitude: lat, longitude: lng, speed: Math.max(0, Number(speed) || 0), accuracy: Number(acc) || 0 } };
  if (nativeMode) handleMyPos(nativeFix);
};
// App Inventor-এর নেটিভ WebViewer-এ JavaScript চালানোর ব্লক নেই; তাই অ্যাপ WebViewString-এ "lat,lng,speed,acc" লিখে রাখে, পেজ প্রতি সেকেন্ডে পড়ে
let lastWvs = "", gpsOffAt = 0;
const gpsIsOff = () => gpsOffAt && Date.now() - gpsOffAt < 6000;
setInterval(function () {
  try {
    if (!window.AppInventor || !window.AppInventor.getWebViewString) return;
    const s = String(window.AppInventor.getWebViewString() || "");
    if (s.indexOf("GPS_OFF") === 0) { gpsOffAt = Date.now(); } else if (s.indexOf("GPS_ON") === 0 || /^-?\d/.test(s)) { gpsOffAt = 0; }
    if (gpsOffAt && nativeMode) { stopSharing(); uiAlert("আপনার জিপিএস বন্ধ আছে। প্রথমে এটি চালু করুন।"); }
    if (!s || s === lastWvs) return;
    lastWvs = s;
    const a = s.split(",");
    if (a.length >= 2) window.nativeLocation(a[0], a[1], a[2], a[3]);
  } catch (e) {}
}, 1000);
// অ্যাপ থেকে GPS ফিড না এলে অ্যাপকে লোকেশন সেটিংস খুলতে বলা (অ্যাপ WebViewString-এ "NEED_GPS" দেখলে খোলে)
let cmdTimer = null;
function sendAppCommand(cmd) {
  if (!(window.AppInventor && window.AppInventor.setWebViewString)) return;
  if (cmdTimer) clearInterval(cmdTimer);
  let n = 0;
  const go = () => { try { window.AppInventor.setWebViewString(cmd); } catch (e) {} if (++n >= 12) { clearInterval(cmdTimer); cmdTimer = null; } };
  go(); cmdTimer = setInterval(go, 250);
}
function askAppOpenSettings() {
  try { if (window.AppInventor && window.AppInventor.setWebViewString) window.AppInventor.setWebViewString("NEED_GPS|" + Date.now()); } catch (e) {}
}
const hasNative = () => !!nativeFix && Date.now() - nativeFix.t < 30000;
function handleMyPos(pos) {
  const ll = [pos.coords.longitude, pos.coords.latitude];
  if (!SHOW_MY_DOT) { /* নীল বিন্দু লুকানো */ } else if (!myMarker) {
    const el = document.createElement("div");
    el.style.cssText = "width:16px;height:16px;border-radius:50%;background:#42a5f5;border:3px solid #fff;box-shadow:0 0 4px #000";
    myMarker = new maplibregl.Marker({ element: el }).setLngLat(ll).addTo(map);
  } else myMarker.setLngLat(ll);
  $("myStatus").textContent = "📍 GPS পাওয়া গেছে" + (pos.coords.accuracy ? " (±" + Math.round(pos.coords.accuracy) + " মিটার)" : "");
  // নেট না থাকলে সার্ভার থেকে নতুন তথ্য আসে না; তখন নিজের GPS-ই ট্রেনের অবস্থান (সার্ভারের ঘড়ির সাথে মিলিয়ে)
  if ((pollFailing || sendFailing) && selId && selId === select.value) {
    const tt = Date.now() + srvSkew;
    onLocation({ time: tt, lat: pos.coords.latitude, lng: pos.coords.longitude, speed: pos.coords.speed || 0, n: 1 }, tt, false);
  }
  sendLocation(pos);
}

let starting = false;
async function startSharing() {
  if (starting) return;
  if (!select.value) { uiAlert("আগে ট্রেন সিলেক্ট করুন।"); return; }
  const appMode = hasNative() || /[?&]app=1/.test(location.search) || !!(window.AppInventor && window.AppInventor.getWebViewString);
  if (appMode && gpsIsOff()) { uiAlert("আপনার জিপিএস বন্ধ আছে। প্রথমে এটি চালু করুন।"); return; }
  if (!appMode && !("geolocation" in navigator)) { uiAlert("আপনার ব্রাউজারে GPS সাপোর্ট নেই।"); return; }
  starting = true;
  const agreed = await uiConfirm("এই ট্রেনের যাত্রী হিসেবে আপনার লোকেশন সবার সাথে শেয়ার করা হবে। চালিয়ে যাবেন?");
  starting = false;
  if (!agreed || watchId !== null) return;
  if (appMode) {   // অ্যাপের LocationSensor থেকে আসা অবস্থান ব্যবহার
    nativeMode = true; watchId = "native";
    if (!hasNative()) sendAppCommand("START_GPS");
    $("myStatus").textContent = "⏳ অ্যাপ থেকে GPS অবস্থানের অপেক্ষা…";
    if (nativeFix) handleMyPos(nativeFix);
    if (!hasNative()) {
      $("myStatus").textContent = "⏳ GPS অবস্থান পাওয়ার অপেক্ষা…";
    }
    shareBtn.textContent = "শেয়ার বন্ধ করুন"; shareBtn.classList.add("on");
    return;
  }
  watchId = navigator.geolocation.watchPosition(
    pos => handleMyPos(pos),
    err => {
      stopSharing();
      let inFrame = "?"; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
      const info = [
        "ত্রুটির কোড: " + err.code + " (১=অনুমতি নেই, ২=অবস্থান পাওয়া যায়নি, ৩=সময় শেষ)",
        "বার্তা: " + (err.message || "—"),
        "ঠিকানা: " + location.href,
        "HTTPS নিরাপদ: " + window.isSecureContext,
        "অন্য পেজের ভেতরে (iframe): " + inFrame
      ];
      const show = st => uiAlert((err.code === 1 ? "লোকেশন অনুমতি দেওয়া হয়নি।" : "লোকেশন পাওয়া যায়নি।") + "\n\n" + info.concat(["ব্রাউজারের অনুমতি: " + st]).join("\n"));
      try { navigator.permissions.query({ name: "geolocation" }).then(r => show(r.state), () => show("জানা যায়নি")); } catch (e) { show("জানা যায়নি"); }
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  shareBtn.textContent = "শেয়ার বন্ধ করুন"; shareBtn.classList.add("on");
}
function stopSharing() {
  if (watchId !== null && watchId !== "native") navigator.geolocation.clearWatch(watchId);
  if (nativeMode) sendAppCommand("STOP_GPS");
  watchId = null; nativeMode = false;
  if (myMarker) { myMarker.remove(); myMarker = null; }
  $("myStatus").textContent = "";
  shareBtn.textContent = "আমি এই ট্রেনে আছি"; shareBtn.classList.remove("on");
}
shareBtn.addEventListener("click", () => watchId === null ? startSharing() : stopSharing());

// ---------- ট্রেন বদল ----------
select.addEventListener("change", () => {
  if (watchId !== null) stopSharing();
  selId = select.value;
  fix = null; head = null; lastLoc = null; live = { has: false, ageMs: 0, recv: 0, n: 0 }; applyDirHint(); geo.text = ""; geo.ll = null;
  if (mapLoaded) { map.getSource("train").setData(EMPTY); map.getSource("trainline").setData(EMPTY); }
  if (pulseAdded) { pulseMarker.remove(); pulseAdded = false; }
  if (mode === "3d") exit3d();
  $("status").textContent = selId ? "লোকেশন খোঁজা হচ্ছে…" : "একটি ট্রেন সিলেক্ট করুন।";
  poll();
});

// ---------- ৩ডি ও ম্যাপ বাটন ----------
const btn3d = $("btn3d"), btnLayer = $("btnLayer");
function setLayer(sat) {
  if (!mapLoaded) return;
  map.setLayoutProperty("sat", "visibility", sat ? "visible" : "none");
  map.setLayoutProperty("osm", "visibility", sat ? "none" : "visible");
  btnLayer.innerHTML = sat ? "🗺️<small>মানচিত্র</small>" : "🛰️<small>স্যাটেলাইট</small>";
  btnLayer.dataset.sat = sat ? "1" : "";
  stations.forEach(s => s.el && s.el.classList.toggle("osm", !sat));
}
btnLayer.addEventListener("click", () => setLayer(!btnLayer.dataset.sat));

function exit3d() {
  mode = "2d"; following = false; flying = false;
  btn3d.classList.remove("active"); btn3d.innerHTML = "3D<small>ট্রেনে জুম</small>";
  setLayer(false);
  map.easeTo({ pitch: 0, bearing: 0, zoom: 12, duration: 1200 });
}
btn3d.addEventListener("click", () => {
  if (mode === "3d" && following) { exit3d(); return; }
  if (!head) { uiAlert("এই ট্রেনের লোকেশন এখনও পাওয়া যায়নি। আগে একটি ট্রেন সিলেক্ট করুন, আর কেউ লোকেশন শেয়ার করছেন কিনা দেখুন।"); return; }
  mode = "3d"; following = false; flying = true;
  btn3d.classList.add("active"); btn3d.innerHTML = "2D<small>ফিরে যান</small>";
  setLayer(true);
  camBearing = (head.heading || 0) + CAM_OFFSET;
  userZoom = CAM_ZOOM; userPitch = CAM_PITCH; manualBearing = false; lastCam = { c: null, b: 0, z: 0, p: 0 };
  map.flyTo({ center: (() => { try { return back(CAM_BACK_M).ll; } catch (e) { return head.ll; } })(), zoom: userZoom, pitch: userPitch, bearing: camBearing, duration: 2200,
    padding: { top: 0, bottom: 150, left: 0, right: 0 }, essential: true });
  map.once("moveend", () => { flying = false; following = true; });
});
// ব্যবহারকারীর আঙুলের জুম/কোণ/ঘোরানো মনে রাখা (ক্যামেরা-ফলো এগুলো আর ভাঙে না)
map.on("zoom", e => { if (e.originalEvent && mode === "3d") userZoom = map.getZoom(); });
map.on("pitch", e => { if (e.originalEvent && mode === "3d") userPitch = map.getPitch(); });
map.on("rotate", e => { if (e.originalEvent && mode === "3d") { manualBearing = true; camBearing = map.getBearing(); } });
map.on("dragstart", e => { if (e.originalEvent && following) { following = false; btn3d.innerHTML = "🎯<small>ট্রেনে ফোকাস</small>"; } });

// ---------- শুরু ----------
loadTrains();
setInterval(poll, POLL_MS);
setInterval(geoTick, 5000);
requestAnimationFrame(tick);
</script>
</body>
